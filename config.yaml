# ------------------------------------------------------------
# Proficiency multipliers
# ------------------------------------------------------------
proficiency_weights:
  expert:       1.00
  advanced:     0.80
  intermediate: 0.50
  beginner:     0.20

# ------------------------------------------------------------
# Behavioral signal tuning
# ------------------------------------------------------------
behavioral:
  # Recency decay: candidates inactive >N days get score decay
  recency_halflife_days: 60
  # Open-to-work bonus multiplier
  open_to_work_bonus: 1.15
  # Notice period: exponential penalty beyond buyout threshold
  notice_penalty_scale: 30
  # Minimum recruiter_response_rate considered "engaged"
  responsive_threshold: 0.3

# ------------------------------------------------------------
# Precompute settings
# ------------------------------------------------------------
precompute:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_batch_size: 512
  top_n_for_groq: 300         # Send top-N candidates to Groq for refined reasoning
  groq_model: "llama-3.3-70b-versatile"
  groq_batch_size: 5          # Candidates per Groq API call
  groq_max_retries: 3
  cache_dir: "./cache"

