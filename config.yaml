# ------------------------------------------------------------
# Composite scoring weights (must sum to 1.0)
# Tuned against JD emphasis:
#   - JD cares most about semantic fit + deep AI skills
#   - Career quality crucial (anti-keyword-stuffer)
#   - Behavioral signals matter (availability/engagement)
# ------------------------------------------------------------
weights:
  semantic_fit:    0.35   # Sentence-transformer cosine sim vs JD
  skill_match:     0.30   # AI/ML core skill coverage & depth
  career_quality:  0.20   # Trajectory, company type, role seniority
  behavioral:      0.15   # Platform engagement, responsiveness, availability

